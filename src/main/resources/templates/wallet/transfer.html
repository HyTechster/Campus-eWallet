<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head>
  <title>Send money · Campus Wallet</title>
</head>
<body>
<main class="wrap">
  <header class="page-head reveal">
    <p class="eyebrow">Send</p>
    <h1>Send to a friend</h1>
    <p class="lede">Find them by email or student ID. You'll see their name before anything is sent.</p>
  </header>

  <form class="card form reveal reveal-2" th:action="@{/wallet/transfer/review}" th:object="${form}" method="post" novalidate>
    <div th:replace="~{fragments/ui :: form-errors}"></div>

    <div class="field">
      <label for="recipient">Email or student ID</label>
      <input class="input" th:field="*{recipient}" autocomplete="off" autocapitalize="none" spellcheck="false"
             placeholder="siti@campus.edu.my or A21CS0123" th:aria-invalid="${#fields.hasErrors('recipient')}">
      <p th:replace="~{fragments/ui :: field-error('recipient')}"></p>
    </div>

    <div class="field">
      <label for="amount">Amount</label>
      <div class="money-input">
        <span class="prefix">RM</span>
        <input class="input" th:field="*{amount}" inputmode="decimal" autocomplete="off" placeholder="0.00"
               aria-describedby="amount-hint" th:aria-invalid="${#fields.hasErrors('amount')}">
      </div>
      <p class="hint" id="amount-hint">
        Balance <span class="num" th:text="${@fmt.money(balance)}">RM 128.50</span>.
        Up to <span class="num" th:text="${@fmt.money(limit)}">RM 500.00</span> each time.
      </p>
      <p th:replace="~{fragments/ui :: field-error('amount')}"></p>
    </div>

    <div class="field">
      <label for="note">Note <span class="muted">(optional)</span></label>
      <input class="input" th:field="*{note}" maxlength="80" autocomplete="off" placeholder="Nasi lemak, thanks!"
             th:aria-invalid="${#fields.hasErrors('note')}">
      <p th:replace="~{fragments/ui :: field-error('note')}"></p>
    </div>

    <button class="btn block" type="submit">Review</button>
  </form>
</main>
</body>
</html>
